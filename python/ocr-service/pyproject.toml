[project]
name = "dolico-ocr"
version = "0.1.0"
description = "Dolico OCR tier: rasterize PDF pages and read them with PaddleOCR"
requires-python = ">=3.11,<3.13"
# What the service needs to exist at all: serve HTTP, rasterize a PDF, and
# hand pixels to whichever engine is installed. No model, and no engine.
#
# Paddle used to be here. It moved to an extra so a deployment that reads
# pages somewhere else -- GLM-OCR's cloud API, say -- does not carry a
# gigabyte of local inference it never calls. See `text` and `structure`.
#
# Pillow is named explicitly now rather than arriving through PaddleOCR:
# raster.wrap_image and raster.image_to_pdf both use it, and they are on the
# path of every request regardless of engine.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pypdfium2>=4.30",
    "numpy>=1.26",
    "pillow>=10.0",
]

# PaddlePaddle publishes no wheels for 3.13+ yet, hence the upper bound above.
# uv picks a compatible interpreter automatically.

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# PP-StructureV3 (Tier 2: layout analysis and table recognition). Separated
# because it roughly adds 150MB and 40 packages on top of Tier 1, and a
# deployment that only wants text lines should not have to carry it. `make ocr`
# installs it, and the service degrades to Tier 1 with a loud log line when it
# is missing.
# Tier 1: text-line OCR. The floor -- it reads any page, badly, and reports a
# real per-block confidence, which is the signal every escalation decision is
# made from.
text = ["paddlepaddle>=3.0", "paddleocr>=3.0"]

# Tier 2: layout analysis and table recognition. A superset of Tier 1, because
# PP-StructureV3 is driven through the same PaddleOCR install.
structure = ["paddlepaddle>=3.0", "paddleocr>=3.0", "paddlex[ocr]>=3.7"]
# MinerU (Tier 3: the fallback for pages the OCR tiers lose). Much heavier
# again -- roughly 1GB of packages plus ~8GB of model weights on first run --
# and it only ever runs on pages that already failed twice, so it is opt-in
# even relative to the other optional tier. See docs/vision-tier-design.md.
#
# Capped below 4: the `core` extra does not exist there. MinerU 4.0 (in
# pre-release as 4.0.0a6) reorganizes its extras into `torch` and `full`, so an
# uncapped range would resolve to a version this line cannot install the moment
# 4.0 goes stable. Lifting the cap means picking the new extra, not just the
# new number.
#
# torch and torchvision are named here even though MinerU pulls them anyway:
# `tool.uv.sources` only binds a project's *direct* dependencies, so the CPU
# index below cannot reach a transitive one. Naming them makes the pin apply.
vision = ["mineru[core]>=2.5,<4", "torch", "torchvision"]
# GLM-OCR (Tier 3, the alternative engine). Selected with
# DOLICO_VISION_ENGINE=glm-ocr; see docs/glm-ocr-tier-design.md.
#
# Two extras, because what runs here depends entirely on where the page is
# read, and the difference is a gigabyte.
#
# `glm` is the cloud API (DOLICO_GLM_API_KEY): Zhipu does layout *and*
# recognition, so nothing model-shaped runs in this process and the base
# package is enough -- pillow, requests, pydantic, pymupdf and a few more.
# Measured, not assumed: a venv with `glmocr` alone has no torch and no
# transformers, and GlmOcr(mode="maas") constructs and reports MaaS mode. The
# pipeline import that would pull them is lazy and only taken when self-hosted.
glm = ["glmocr>=0.1.5"]

# `glm-selfhosted` adds the layout stage, for pointing DOLICO_VISION_URL at
# your own vLLM/SGLang/MLX/Ollama server. PP-DocLayoutV3 runs here then, under
# torch, so this costs roughly what the MinerU extra does. `layout` rather than
# `selfhosted` upstream: the two differ only by pypdfium2, which this service
# already has.
glm-selfhosted = ["glmocr[layout]>=0.1.5"]

# MinerU and a *self-hosted* GLM-OCR cannot share an environment, and this is
# where that is enforced rather than discovered.
#
# MinerU pins transformers>=4.57.3,<5.0.0; glmocr[layout] requires
# transformers>=5.3.0. No version satisfies both, so resolving those two extras
# together fails outright.
#
# The plain `glm` extra is not in this pair, and that is the point of splitting
# them: the cloud path brings no transformers at all, so it conflicts with
# nothing. An image can carry MinerU and cloud GLM-OCR at once --
# DOLICO_VISION_ENGINE still picks which one Tier 3 uses, but the dependency
# graph no longer forces the choice at build time.
[tool.uv]
conflicts = [
    [{ extra = "vision" }, { extra = "glm-selfhosted" }],
]

# torch from PyTorch's CPU index on Linux, and only there.
#
# The default wheels bring the whole CUDA runtime as hard dependencies -- 19
# packages, `nvidia-cublas` alone 543MB, ~3.0GB in total -- onto a host that
# may well have no GPU. Measured on the estate that runs this: the OCR image
# came out at 10.6GB, and pulling those wheels through the configured PyPI
# mirror took over three hours at 251 KB/s. The CPU index serves the same
# torch without them, and answers that host at 5.4 MB/s.
#
# Linux only, because that is where the CUDA wheels exist at all: macOS torch
# has no GPU variant to pin away from, and a developer on CUDA hardware who
# wants the default gets it by removing this block rather than by discovering
# their GPU quietly stopped being used.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dolico_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
