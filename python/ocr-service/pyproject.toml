[project]
name = "dolico-ocr"
version = "0.1.0"
description = "Dolico OCR tier: rasterize PDF pages and read them with PaddleOCR"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pypdfium2>=4.30",
    "numpy>=1.26",
    "paddlepaddle>=3.0",
    "paddleocr>=3.0",
]

# PaddlePaddle publishes no wheels for 3.13+ yet, hence the upper bound above.
# uv picks a compatible interpreter automatically.

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# PP-StructureV3 (Tier 2: layout analysis and table recognition). Separated
# because it roughly adds 150MB and 40 packages on top of Tier 1, and a
# deployment that only wants text lines should not have to carry it. `make ocr`
# installs it, and the service degrades to Tier 1 with a loud log line when it
# is missing.
structure = ["paddlex[ocr]>=3.7"]
# MinerU (Tier 3: the fallback for pages the OCR tiers lose). Much heavier
# again -- roughly 1GB of packages plus ~8GB of model weights on first run --
# and it only ever runs on pages that already failed twice, so it is opt-in
# even relative to the other optional tier. See docs/vision-tier-design.md.
vision = ["mineru[core]>=2.5"]
# GLM-OCR (Tier 3, the alternative engine). Selected with
# DOLICO_VISION_ENGINE=glm-ocr; see docs/glm-ocr-tier-design.md.
#
# `layout` rather than `selfhosted`: the two differ only by pypdfium2, which
# this service already depends on, and `layout` names what actually runs in
# this process. The 0.9B VLM does not -- it is reached over HTTP at
# DOLICO_VISION_URL, and without one the engine reports itself unavailable
# rather than reaching for the vendor's cloud API.
#
# Not as light as that makes it sound: the layout stage is PP-DocLayoutV3 under
# torch, so this extra costs roughly what the MinerU one does. GLM-OCR being
# the smaller model is an argument about the box serving it, not about this
# one.
glm = ["glmocr[layout]>=0.1.5"]

# The two Tier 3 engines cannot share an environment, and this is where that
# is enforced rather than discovered.
#
# MinerU pins transformers>=4.57.3,<5.0.0; glmocr requires transformers>=5.3.0.
# There is no version satisfying both, so resolving the extras together fails
# outright -- which is the honest answer: a service runs one vision engine, and
# DOLICO_VISION_ENGINE selects which one it was built with, not which one it
# switches to at runtime. Declaring the conflict lets uv resolve each extra
# separately and keeps one lockfile for both.
[tool.uv]
conflicts = [
    [{ extra = "vision" }, { extra = "glm" }],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dolico_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
