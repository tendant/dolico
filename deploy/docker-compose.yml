# Internal deployment: the API server and the OCR tier on one host.
#
# The API is published on the loopback interface only. Nothing here does
# authentication, so exposing 8080 to anything but a gateway you control hands
# every document in the store to whoever finds the port. See deploy/README.md
# for what that gateway has to do.
#
#   docker compose -f deploy/docker-compose.yml up -d --build

name: dolico

services:
  ocr:
    # Named, so a host that is not the build host can pull instead of building
    # a 4.2GB image for itself:
    #
    #   DOLICO_TAG=39d18d6 docker compose pull
    #   DOLICO_TAG=39d18d6 docker compose up -d --no-build
    #
    # `--no-build` is not decoration: with a build section present, compose
    # quietly builds an image it cannot find rather than failing, which is the
    # fallback a server is trying to avoid. Pin DOLICO_TAG to the commit SHA CI
    # pushed; `latest` is a convenience for the build host, and a server left on
    # it changes version on its next restart.
    image: ${DOLICO_REGISTRY:-reg.memochat.ai}/dolico-ocr:${DOLICO_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ocr
    # PaddlePaddle publishes no Linux aarch64 wheels -- only manylinux x86_64,
    # macOS arm64 and Windows. So this image is amd64 whatever the host is.
    # On an Apple Silicon machine that means emulation, and Paddle is CPU-bound
    # numeric code, so expect it to be several times slower than the native
    # `make ocr` you have been developing against. A real amd64 server runs it
    # natively and the setting costs nothing there.
    platform: ${DOLICO_OCR_PLATFORM:-linux/amd64}
    environment:
      # One inference uses about one core and does not thread, so throughput
      # comes from processes. Each costs ~3GB once warm -- keep this and
      # mem_limit in step.
      DOLICO_OCR_WORKERS: ${DOLICO_OCR_WORKERS:-2}
      # Paddle's oneDNN backend is x86 code. Emulated on Apple Silicon it dies
      # inside inference with "ConvertPirAttribute2RuntimeAttribute not
      # support", which arrives as a 500 from /v1/extract and tells you nothing
      # about the cause. Set DOLICO_PADDLE_MKLDNN=False to develop against this
      # stack on an arm64 machine; leave it alone on an amd64 server, where
      # oneDNN works and is the faster path.
      PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT: ${DOLICO_PADDLE_MKLDNN:-True}
    volumes:
      # Models are downloaded on first start. Without this volume every
      # container restart re-downloads a few hundred megabytes and spends
      # minutes unhealthy.
      - paddle-models:/home/dolico/.paddlex
    mem_limit: ${OCR_MEM_LIMIT:-8g}
    restart: unless-stopped
    # Reachable from the api service, not from the host.
    expose:
      - "8181"
    healthcheck:
      # Spelled out rather than inheriting the image's, because a compose
      # healthcheck with no `test` merges with the image's differently across
      # Docker versions -- and this one gates whether the API starts at all.
      #
      # start_period is longer than the image's: a cold model volume on a slow
      # link can take a while, and /healthz returns 503 until every worker has
      # loaded its models.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8181/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 600s

  api:
    image: ${DOLICO_REGISTRY:-reg.memochat.ai}/dolico-api:${DOLICO_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        # Empty unless it is set in the environment. Nothing is committed with
        # a value -- see deploy/README.md, "Building behind a slow index".
        CARGO_REGISTRY_MIRROR: ${CARGO_REGISTRY_MIRROR:-}
    environment:
      DOLICO_OCR_URL: http://ocr:8181
      DOLICO_DATA_DIR: /var/lib/dolico
      # Uploads that use ?wait=true block for up to DOLICO_SHIM_TIMEOUT + 30s.
      # Whatever sits in front needs a read timeout longer than this.
      DOLICO_SHIM_TIMEOUT: ${DOLICO_SHIM_TIMEOUT:-120s}
      DOLICO_MAX_UPLOAD_BYTES: ${DOLICO_MAX_UPLOAD_BYTES:-268435456}
    depends_on:
      ocr:
        # Not just "started": the API exits at boot if the OCR service is
        # configured and unreachable, which is deliberate -- serving stub text
        # under a configuration that promises real OCR would be worse.
        condition: service_healthy
    volumes:
      - dolico-data:/var/lib/dolico
    ports:
      # Loopback only. Change this and you have published an unauthenticated
      # document store.
      - "127.0.0.1:${DOLICO_PORT:-8080}:8080"
    mem_limit: ${API_MEM_LIMIT:-2g}
    restart: unless-stopped

volumes:
  # Blobs and derived documents. Nothing prunes this -- see deploy/README.md.
  dolico-data:
  # PaddleOCR model cache. Disposable: deleting it costs a slow first start.
  paddle-models:
